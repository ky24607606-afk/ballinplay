<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Ball in Play Tracker</title>
<meta name="theme-color" content="#0A0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0A0F12; --bg-2:#0D1418; --surface:#111A20; --raise:#17222A;
  --line:#1F2C35; --line-2:#2C3D48;
  --ink:#ECF2F4; --ink-2:#A6B5BC; --muted:#6B7C85;
  --go:#1FC46B; --go-deep:#0E8F4B; --go-ink:#03150B;
  --stop:#FF3D52; --stop-deep:#C11A30; --stop-ink:#FFFFFF;
  --warn:#F0B23A; --warn-bg:rgba(240,178,58,.12);
  --sel:#ECF2F4; --sel-ink:#0A0F12;
  --glow-go:rgba(31,196,107,.22); --glow-stop:rgba(255,61,82,.26);
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-ui:"Barlow","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#EDF1F0; --bg-2:#E5EBEA; --surface:#FFFFFF; --raise:#F4F7F6;
    --line:#D6DFDD; --line-2:#C0CCC9;
    --ink:#0B1417; --ink-2:#3B4A50; --muted:#6A7A80;
    --go:#0FA956; --go-deep:#0A7F40; --go-ink:#FFFFFF;
    --stop:#E2263C; --stop-deep:#B0142A; --stop-ink:#FFFFFF;
    --warn:#A86E05; --warn-bg:rgba(200,140,20,.13);
    --sel:#0B1417; --sel-ink:#FFFFFF;
    --glow-go:rgba(15,169,86,.18); --glow-stop:rgba(226,38,60,.18);
    --shadow:0 18px 40px -22px rgba(10,30,30,.35);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#EDF1F0; --bg-2:#E5EBEA; --surface:#FFFFFF; --raise:#F4F7F6;
  --line:#D6DFDD; --line-2:#C0CCC9;
  --ink:#0B1417; --ink-2:#3B4A50; --muted:#6A7A80;
  --go:#0FA956; --go-deep:#0A7F40; --go-ink:#FFFFFF;
  --stop:#E2263C; --stop-deep:#B0142A; --stop-ink:#FFFFFF;
  --warn:#A86E05; --warn-bg:rgba(200,140,20,.13);
  --sel:#0B1417; --sel-ink:#FFFFFF;
  --glow-go:rgba(15,169,86,.18); --glow-stop:rgba(226,38,60,.18);
  --shadow:0 18px 40px -22px rgba(10,30,30,.35);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--f-ui);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lbl{font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:10px 40px;display:grid;gap:18px}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left;padding:6px 8px 6px 0;border-radius:10px}
.mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);flex:none}
.mark svg{width:20px;height:20px}
.brand-txt{min-width:0;display:grid}
.brand-k{font-family:var(--f-num);font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.brand-n{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.brand-n svg{flex:none;opacity:.5}
.chip{font-family:var(--f-num);font-weight:600;font-size:10.5px;letter-spacing:.14em;padding:2px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-2)}
.chip.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn svg{width:19px;height:19px}

.layout{display:grid;gap:22px}
@media (min-width:920px){
  .layout{grid-template-columns:minmax(380px,1fr) minmax(420px,1.05fr);align-items:start;gap:36px}
  .col-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
}
.col-main{display:grid;gap:18px;justify-items:center}

/* ---------- period ---------- */
.period{display:flex;gap:10px;align-items:center;justify-content:center;width:100%}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);gap:2px}
.seg button{font-family:var(--f-num);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:7px 18px;border-radius:9px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.seg button:disabled{cursor:not-allowed}
.seg.locked button:not([aria-pressed="true"]){opacity:.35}
.seg svg{width:12px;height:12px}
.pbtn{font-family:var(--f-num);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:12px;border:1px solid var(--line-2);color:var(--ink-2);background:transparent}
.pbtn:hover{color:var(--ink);border-color:var(--muted)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn.armed{background:var(--warn);border-color:var(--warn);color:#141004}
.pdone{font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);padding:9px 4px}
.seg.small button{font-size:13px;padding:5px 12px}

/* ---------- clocks ---------- */
.clocks{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:460px;border-block:1px solid var(--line)}
.clock{padding:12px 4px;display:grid;gap:2px;justify-items:center}
.clock + .clock{border-left:1px solid var(--line)}
.clock .v{font-size:40px;font-weight:600;line-height:1}
.clock .v small{font-size:.5em;color:var(--muted);font-weight:500;margin-left:2px}
.clock .s{font-size:11.5px;color:var(--muted);min-height:16px}
.clock .s.frozen{color:var(--warn)}

/* ---------- pad ---------- */
.stage{position:relative;display:grid;place-items:center;width:100%;padding-block:6px 4px}
.stage::before{content:"";position:absolute;inset:-10% 0;background:radial-gradient(closest-side,var(--glow),transparent 72%);pointer-events:none;transition:background .25s}
.stage{--glow:var(--glow-go)}
.stage.running{--glow:var(--glow-stop)}
.pad{
  --size:min(76vw,44vh,340px);
  position:relative;width:var(--size);height:var(--size);border-radius:50%;
  display:grid;place-items:center;align-content:center;gap:2px;
  background:radial-gradient(120% 120% at 30% 20%,var(--go) 0%,var(--go-deep) 100%);
  color:var(--go-ink);
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 -10px 30px rgba(0,0,0,.18) inset,var(--shadow);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .09s ease, background .18s ease, color .18s;
}
@media (min-width:920px){.pad{--size:min(400px,50vh)}}
.pad.running{background:radial-gradient(120% 120% at 30% 20%,var(--stop) 0%,var(--stop-deep) 100%);color:var(--stop-ink)}
.pad.pressing{transform:scale(.965)}
.pad:disabled{filter:grayscale(.8);opacity:.5;cursor:not-allowed}
.pad .ring{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);transform:rotate(-90deg);pointer-events:none}
.ring-track{fill:none;stroke:var(--line);stroke-width:2}
.ring-arc{fill:none;stroke:var(--stop);stroke-width:3;stroke-linecap:round;transition:stroke .2s}
.pad:not(.running) .ring-arc{stroke:transparent}
.pad-k{font-family:var(--f-num);font-weight:700;letter-spacing:.2em;font-size:calc(var(--size)*.075);opacity:.85}
.pad-main{font-family:var(--f-num);font-weight:700;font-size:calc(var(--size)*.25);line-height:.95;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.pad.running .pad-main{font-size:calc(var(--size)*.29)}
.pad-sub{font-family:var(--f-num);font-weight:600;font-size:calc(var(--size)*.058);letter-spacing:.08em;opacity:.78;text-transform:uppercase;margin-top:4px}
.pad::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid currentColor;opacity:0;pointer-events:none}
.pad.flash::after{animation:burst .45s ease-out}
@keyframes burst{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
.bop-line{font-size:13px;color:var(--muted);min-height:20px;display:flex;gap:14px;justify-content:center}
.bop-line b{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ---------- stats ---------- */
.col-side{display:grid;gap:18px;width:100%;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 10px 16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stat{padding:12px 14px 14px 16px;display:grid;gap:3px;min-width:0}
.stat:nth-child(3n+2),.stat:nth-child(3n+3){border-left:1px solid var(--line)}
.stat:nth-child(n+4){border-top:1px solid var(--line)}
.stat .v{font-size:32px;font-weight:600;line-height:1;white-space:nowrap}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.stat.live .v{color:var(--stop)}
.stat .d{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.stat .v{font-size:26px}}

/* ---------- history ---------- */
.hist-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);font-weight:600;font-size:14px;color:var(--ink);background:var(--raise)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn.ghost{background:transparent}
.btn.primary{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.btn.danger{color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,transparent);background:transparent}
.btn.danger.armed{background:var(--stop);color:var(--stop-ink)}
.btn.block{width:100%;justify-content:center;padding:13px}
.hgrid{display:grid;grid-template-columns:52px 1fr 1fr 58px 64px 68px;align-items:center;column-gap:6px}
.hhead{padding:8px 12px 8px 16px;border-block:1px solid var(--line);background:var(--bg-2)}
.hhead span{font-family:var(--f-num);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hhead span.r,.hrow .r{text-align:right}
.hbody{max-height:none}
@media (min-width:920px){.hbody{max-height:calc(100vh - 470px);min-height:220px;overflow-y:auto}}
.hrow{padding:9px 12px 9px 16px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums;cursor:pointer}
.hrow:hover{background:var(--raise)}
.hrow .no{color:var(--muted);font-size:14px;position:relative}
.hrow .no.ed::after{content:"";position:absolute;top:2px;left:-8px;width:5px;height:5px;border-radius:50%;background:var(--ink-2)}
.ttag{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;letter-spacing:.06em;line-height:1;padding:3px 4px;border-radius:4px;vertical-align:2px}
.ttag.us{background:var(--sel);color:var(--sel-ink)}
.ttag.opp{border:1px solid var(--ink-2);color:var(--ink-2);padding:2px 3px}
.score .bd{font-size:12px;color:var(--muted);font-family:var(--f-num);letter-spacing:.06em;white-space:nowrap}
.scorepad{display:grid;gap:6px;justify-items:center;width:100%;max-width:440px}
.sp-head{display:flex;gap:10px;align-items:baseline;justify-content:center;flex-wrap:wrap}
.sp-live{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sp-live b{color:var(--ink);font-size:18px}
.sp-row{display:grid;grid-template-columns:minmax(52px,76px) repeat(4,1fr);gap:5px;align-items:center;width:100%}
.sp-team{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spb{font-family:var(--f-num);font-weight:600;font-size:13.5px;letter-spacing:.06em;padding:8px 0;border-radius:9px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.spb small{font-size:11px;opacity:.7;margin-left:3px}
.spb:hover{color:var(--ink)}
.spb:disabled{opacity:.3;cursor:not-allowed}
.spb[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}

/* ---------- report ---------- */
/* ---------- A4 print pages (rendered off-screen, then to PDF) ---------- */
.pr-host{position:fixed;left:-12000px;top:0;z-index:-1;display:grid;gap:20px}
.pr-page{width:794px;height:1123px;background:#FFFFFF;color:#101618;font:12px/1.4 var(--f-ui);display:flex;flex-direction:column;padding:40px 44px 26px;box-sizing:border-box;color-scheme:light}
.pr-body{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.pr-foot{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid #D5DCDA;color:#6A777C;font-size:10px;font-family:var(--f-num);letter-spacing:.08em;text-transform:uppercase}
.pr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:14px;border-bottom:2px solid #101618}
.pr-k{font-family:var(--f-num);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#0A7F40}
.pr-h1{font-size:24px;font-weight:600;margin:2px 0 2px;line-height:1.15}
.pr-meta{color:#5A686D;font-size:11.5px}
.pr-score{display:flex;align-items:center;gap:14px;text-align:center}
.pr-score .tn{font-size:11px;font-weight:600;color:#3B4A50;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-score .tv{font-family:var(--f-num);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pr-score .bd{font-family:var(--f-num);font-size:10.5px;color:#6A777C;letter-spacing:.04em;white-space:nowrap}
.pr-score .dash{font-family:var(--f-num);font-size:28px;color:#9AA6AA}
.pr-sec{display:grid;gap:6px}
.pr-t{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#101618;display:flex;justify-content:space-between;align-items:baseline}
.pr-t span{font-weight:500;letter-spacing:.04em;text-transform:none;color:#6A777C;font-family:var(--f-ui);font-size:10.5px}
.pr-tab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.pr-tab th{font-family:var(--f-num);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6A777C;text-align:right;padding:5px 8px;border-bottom:1px solid #101618;white-space:nowrap}
.pr-tab td{padding:3px 8px;border-bottom:1px solid #E3E8E6;text-align:right;font-family:var(--f-num);font-size:13.5px;font-weight:600;white-space:nowrap}
.pr-tab th:first-child,.pr-tab td:first-child{text-align:left;padding-left:0}
.pr-tab td.l{text-align:left;font-family:var(--f-ui);font-size:11.5px;font-weight:500;color:#3B4A50}
.pr-tab td.sm{font-size:12px;font-weight:500;color:#3B4A50}
.pr-tab .hl{background:#EEF3F1}
.pr-tab small{font-size:10px;color:#6A777C;font-weight:500;margin-left:1px}
.pr-bar{height:10px;background:#EEF3F1;width:180px}
.pr-bar i{display:block;height:100%;background:#3B4A50}
.pr-tag{display:inline-block;font-family:var(--f-num);font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:0 4px;border:1px solid #9AA6AA;border-radius:3px;color:#5A686D;margin-left:4px;vertical-align:1px}
.pr-note{color:#6A777C;font-size:10.5px}
/* ---------- squad ---------- */
.sq-bar{position:sticky;top:0;z-index:2;display:grid;gap:8px;padding:12px 14px;border-radius:14px;background:var(--raise);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.sq-bar .t{font-size:14px;color:var(--ink-2)}
.sq-bar .t b{color:var(--ink);font-weight:600}
.sq-bar .t .num{font-size:16px}
.sq-bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.sq-bar .acts .btn{flex:1;justify-content:center;min-width:88px}
.sq-cols{display:grid;gap:16px}
@media (min-width:860px){.sq-cols{grid-template-columns:1fr 1fr;align-items:start}}
.phead,.prow{display:grid;grid-template-columns:36px minmax(0,1fr) 62px 62px;column-gap:8px;align-items:center;padding:9px 14px 9px 16px}
.phead{background:var(--bg-2);border-block:1px solid var(--line)}
.phead span{font-family:var(--f-num);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.phead .r,.prow .r{text-align:right}
.prow{width:100%;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.prow:last-child{border-bottom:0}
button.prow:hover{background:var(--raise)}
.prow.sel{background:var(--sel);color:var(--sel-ink)}
.prow.sel .pn,.prow.sel .pv,.prow.sel .ptag{color:var(--sel-ink);border-color:var(--sel-ink)}
.prow .pno{font-family:var(--f-num);font-weight:700;font-size:17px}
.prow .pn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pv{font-family:var(--f-num);font-weight:600;font-size:16px;color:var(--ink-2)}
.ptag{display:inline-block;margin-left:6px;font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted);vertical-align:1px}
.ptag.y{border-color:var(--warn);color:var(--warn)}
.ptag.rd{border-color:var(--stop);color:var(--stop)}
.evrow{display:grid;grid-template-columns:112px minmax(0,1fr) 34px;gap:10px;align-items:center;padding:8px 14px 8px 16px;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:0}
.evrow .inp{padding:6px 8px;font-size:15px}
.evrow .d{font-size:13.5px;color:var(--ink-2);min-width:0}
.evrow .d b{color:var(--ink);font-weight:600}
.evrow .d small{display:block;color:var(--muted);font-size:12px}
.setrow{display:grid;grid-template-columns:28px 56px minmax(0,1fr) auto 34px;gap:8px;align-items:center;padding:8px 14px 8px 16px;border-bottom:1px solid var(--line)}
.setrow .inp{padding:7px 8px;font-size:16px;text-align:center}
.setrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.setrow .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setrow.out .pn,.setrow.out .inp{opacity:.45}
.report{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));animation:fade .15s}
.rp{max-width:1080px;margin:0 auto;display:grid;gap:16px}
.rp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rp-h h2{margin:2px 0 0;font-size:22px;font-weight:600;text-wrap:balance}
.rp-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.score{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 16px;border-block:1px solid var(--line)}
.score .side{display:grid;justify-items:center;gap:2px;min-width:0}
.score .tn{font-size:13px;color:var(--ink-2);font-weight:600;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .tv{font-family:var(--f-num);font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.score .dash{font-family:var(--f-num);font-size:30px;color:var(--muted)}
.rp-grid{display:grid;gap:16px}
@media (min-width:860px){.rp-grid{grid-template-columns:1.05fr 1fr;align-items:start}}
.tablewrap{overflow-x:auto}
.mtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mtab th,.mtab td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mtab th:first-child,.mtab td:first-child{text-align:left;padding-left:16px}
.mtab thead th{font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg-2)}
.mtab td{font-family:var(--f-num);font-size:20px;font-weight:600}
.mtab td small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.mtab td:first-child{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--ink-2)}
.mtab td.full,.mtab th.full{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.mtab tr:last-child td{border-bottom:0}
.drow{display:grid;grid-template-columns:62px 1fr 34px 52px;align-items:center;column-gap:10px;row-gap:3px;padding:8px 14px 8px 16px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .rg{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.drow .tr{height:14px;background:var(--bg-2);border-radius:0 4px 4px 0;overflow:hidden}
.drow .br{height:100%;background:var(--ink-2);border-radius:0 4px 4px 0}
.drow .n{font-family:var(--f-num);font-weight:600;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.drow .pc{font-family:var(--f-num);font-weight:500;font-size:15px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.drow .hs{grid-column:2 / -1;font-size:11.5px;color:var(--muted)}
.dhead{display:grid;grid-template-columns:62px 1fr 34px 52px;column-gap:10px;padding:9px 14px 9px 16px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.dhead span{font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dhead span.r{text-align:right}
.rp-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hrow .t{color:var(--ink-2)}
.hrow .bip{font-weight:600;color:var(--ink)}
.hrow .bop{color:var(--ink-2)}
.hrow .bop.long{color:var(--warn);font-weight:600}
.hrow .bop .adj{display:block;font-size:11px;color:var(--muted);font-weight:500;line-height:1}
.hrow.live{background:color-mix(in srgb,var(--stop) 9%,transparent)}
.hrow.live .bip{color:var(--stop)}
.livetag{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--stop)}
.ops{display:flex;justify-content:flex-end;gap:2px}
.op{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.op:hover{color:var(--ink);background:var(--line)}
.op svg{width:15px;height:15px}
.op.armed{background:var(--stop);color:var(--stop-ink)}
.hsec{padding:8px 16px;font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--bg-2);border-bottom:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,8,10,.6);backdrop-filter:blur(3px);z-index:54;animation:fade .15s}
.sheet{position:fixed;z-index:55;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out;box-shadow:0 -20px 60px rgba(0,0,0,.4)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px;border-bottom:1px solid var(--line);animation:fade .15s;max-height:86vh}}
@keyframes rise{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 12px}
@media (min-width:700px){.grab{display:none}}
.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh-h h2{margin:0;font-size:20px;font-weight:600;text-wrap:balance}
.sh-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sh-sec{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.sh-sec:first-of-type{border-top:0;padding-top:0}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2);font-size:16px}
.inp.num{font-family:var(--f-num);font-size:20px;font-weight:600;letter-spacing:.03em}
.inp:focus{outline:none;border-color:var(--ink-2)}
.inp.bad{border-color:var(--stop)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nudge button{padding:8px 0;border-radius:8px;border:1px solid var(--line);font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--ink-2);background:var(--raise)}
.nudge button:hover{color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;color:var(--ink-2)}
.kv b{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.msg{font-size:13px;color:var(--stop);min-height:18px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:500}
.sh-foot{display:flex;gap:10px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sh-foot .btn{flex:1;justify-content:center;padding:12px}
.slist{display:grid;gap:8px}
.sitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 12px 12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);text-align:left;width:100%}
.sitem.on{border-color:var(--ink-2)}
.sitem .n{font-weight:600;display:flex;gap:8px;align-items:center}
.sitem .m{font-size:12.5px;color:var(--muted)}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typepick button{padding:12px;border-radius:12px;border:1px solid var(--line-2);text-align:left;display:grid;gap:2px}
.typepick button[aria-pressed="true"]{border-color:var(--ink);background:var(--raise)}
.typepick b{font-family:var(--f-num);letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.typepick span{font-size:12px;color:var(--muted)}
.loglist{font-size:12.5px;color:var(--muted);display:grid;gap:3px;font-variant-numeric:tabular-nums}
.choice{display:grid;gap:8px}
.choice button{display:grid;gap:2px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg-2)}
.choice button:hover{border-color:var(--ink-2)}
.choice b{font-weight:600}
.choice span{font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);color:var(--sel-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{font-weight:700;text-decoration:underline;color:inherit}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(() => {
'use strict';

/* =========================================================
   Format helpers
   ========================================================= */
const p2 = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

/** seconds with tenths; m:ss.t once over a minute */
function fmtDur(ms) {
  if (ms == null) return '—';
  const t = Math.round(Math.max(0, ms) / 100) / 10;
  if (t < 60) return t.toFixed(1);
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}
/** m:ss, no tenths (totals) */
function fmtMS(ms) {
  if (ms == null) return '—';
  const t = Math.floor(Math.max(0, ms) / 1000);
  return Math.floor(t / 60) + ':' + p2(t % 60);
}
/** match clock MM:SS (minutes unbounded) */
function fmtClock(ms) {
  if (ms == null) return '--:--';
  const neg = ms < 0, t = Math.floor(Math.abs(ms) / 1000);
  return (neg ? '-' : '') + p2(Math.floor(t / 60)) + ':' + p2(t % 60);
}
/* All wall-clock times are shown and exported in Japan Standard Time (UTC+09:00, no DST),
   whatever the device's own time zone is. Stored timestamps stay as Unix ms. */
const JST_MS = 9 * 3600000, DAY_MS = 86400000;
const J = ts => new Date(ts + JST_MS); // read with getUTC* only
function fmtHMS(ts) { const d = J(ts); return p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()); }
function fmtHMSt(ts) { const d = J(ts); return fmtHMS(ts) + '.' + Math.floor(d.getUTCMilliseconds() / 100); }
function isoLocal(ts) {
  const d = J(ts);
  return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + 'T' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()) + '.' + String(d.getUTCMilliseconds()).padStart(3, '0') + '+09:00';
}
function todayStr(ts = Date.now()) { const d = J(ts); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
/** Unix ms of 00:00 JST on the JST day containing ts */
const jstDayStart = ts => Math.floor((ts + JST_MS) / DAY_MS) * DAY_MS - JST_MS;
/** "HH:MM:SS(.fff)" → timestamp on the calendar day nearest to refTs */
function parseTime(str, refTs) {
  const m = String(str).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2})(?:\.(\d{1,3}))?)?$/);
  if (!m) return null;
  const h = +m[1], mi = +m[2], s = +(m[3] || 0), ms = m[4] ? +m[4].padEnd(3, '0') : 0;
  if (h > 23 || mi > 59 || s > 59) return null;
  let best = null;
  for (const dd of [-1, 0, 1]) {
    const t = jstDayStart(refTs) + dd * DAY_MS + ((h * 60 + mi) * 60 + s) * 1000 + ms;
    if (best == null || Math.abs(t - refTs) < Math.abs(best - refTs)) best = t;
  }
  return best;
}
/** unchanged field keeps the original millisecond value */
const readTime = (v, orig) => v.trim() === fmtHMSt(orig) ? orig : parseTime(v, orig);
const tzName = () => 'Asia/Tokyo';
const tzLabel = () => 'JST · UTC+09:00';

/* =========================================================
   Core — pure calculation, no DOM. Everything is derived
   from stored timestamps, never from render ticks.
   ========================================================= */
const HALF_LABEL = { '1': '1st Half', '2': '2nd Half', 'T': 'Training', full: 'Full Match' };

/* Rugby union scoring. One scoring event per BIP (play stops after a score);
   a conversion belongs to the try it follows. Penalty goals are kicked after
   the BIP that ended with the penalty, so they attach to that BIP. */
const SCORE = {
  try:    { pts: 5, short: 'T',  name: 'Try' },
  pentry: { pts: 7, short: 'PT', name: 'Penalty try' },
  pg:     { pts: 3, short: 'PG', name: 'Penalty goal' },
  dg:     { pts: 3, short: 'DG', name: 'Drop goal' },
};
const CONV_PTS = 2;
/** score on a BIP; reads the earlier `try: 'us'|'opp'` field too */
const scoreOf = b => b.score || (b.try ? { side: b.try, type: 'try', conv: null } : null);
const scorePts = sc => !sc ? 0 : SCORE[sc.type].pts + (sc.type === 'try' && sc.conv === true ? CONV_PTS : 0);
const scoreShort = sc => SCORE[sc.type].short + (sc.type === 'try' && sc.conv === true ? '+C' : '');
function tally(list) {
  return {
    pts: list.reduce((a, sc) => a + scorePts(sc), 0),
    tries: list.filter(sc => sc.type === 'try' || sc.type === 'pentry').length,
    conv: list.filter(sc => sc.type === 'try' && sc.conv === true).length,
    convMiss: list.filter(sc => sc.type === 'try' && sc.conv === false).length,
    pentry: list.filter(sc => sc.type === 'pentry').length,
    pg: list.filter(sc => sc.type === 'pg').length,
    dg: list.filter(sc => sc.type === 'dg').length,
  };
}
const Core = {
  halves(s) { return s.type === 'match' ? ['1', '2'] : ['T']; },
  bipsOf(s, half) {
    return s.bips.filter(b => !b.deleted && b.half === half).sort((a, b) => a.startTs - b.startTs);
  },
  running(s) { return s.bips.find(b => !b.deleted && b.endTs == null) || null; },
  /** Rows with BIP and the BOP that follows it. BOP only links BIPs inside the same half. */
  rows(s, half) {
    const list = this.bipsOf(s, half);
    return list.map((b, i) => {
      const next = list[i + 1];
      const bipMs = b.endTs != null ? b.endTs - b.startTs : null;
      const bopOrigMs = (b.endTs != null && next && !next.bopBreakBefore) ? Math.max(0, next.startTs - b.endTs) : null;
      const bopExclMs = bopOrigMs != null ? Math.min(Math.max(0, b.bopExcludedMs || 0), bopOrigMs) : 0;
      const bopAdjMs = bopOrigMs != null ? bopOrigMs - bopExclMs : null;
      return { b, no: i + 1, half, bipMs, bopOrigMs, bopExclMs, bopAdjMs };
    });
  },
  scopeRows(s, scope) {
    if (scope === 'full') return this.halves(s).flatMap(h => this.rows(s, h));
    return this.rows(s, scope);
  },
  /** Aggregates from raw rows. Full match = rows of both halves, recomputed (never averaged). */
  stats(rows) {
    const done = rows.filter(r => r.bipMs != null);
    const count = done.length;
    const total = done.reduce((a, r) => a + r.bipMs, 0);
    const max = done.reduce((a, r) => Math.max(a, r.bipMs), 0);
    const maxRow = done.find(r => r.bipMs === max) || null;
    const pairs = done.filter(r => r.bopOrigMs != null);
    const pairBip = pairs.reduce((a, r) => a + r.bipMs, 0);
    const pairBopAdj = pairs.reduce((a, r) => a + r.bopAdjMs, 0);
    const bopOrig = pairs.reduce((a, r) => a + r.bopOrigMs, 0);
    return {
      count, total, avg: count ? total / count : null, max: count ? max : null, maxRow,
      pairs: pairs.length, pairBip, pairBopAdj,
      bopOrigTotal: bopOrig, bopAdjTotal: pairBopAdj,
      rest: pairs.length && pairBip > 0 ? pairBopAdj / pairBip : null,
      bins: this.bins(done),
      score: {
        us: tally(rows.map(r => scoreOf(r.b)).filter(x => x && x.side === 'us')),
        opp: tally(rows.map(r => scoreOf(r.b)).filter(x => x && x.side === 'opp')),
      },
    };
  },
  /** BIP length bands. Lower bound inclusive, on the 0.1 s value shown on screen (20.0 s → 20–40). */
  BINS: [[0, 20, '0–20'], [20, 40, '20–40'], [40, 60, '40–60'], [60, 80, '60–80'], [80, 100, '80–100'], [100, 120, '100–120'], [120, Infinity, '120+']],
  bins(done) {
    const n = done.length;
    return this.BINS.map(([lo, hi, label]) => {
      const count = done.filter(r => { const s = Math.round(r.bipMs / 100) / 10; return s >= lo && s < hi; }).length;
      return { lo, hi, label, count, pct: n ? count / n * 100 : null };
    });
  },
  baseMs(s, half) { return half === '2' ? (s.settings.secondHalfBaseSec ?? 2400) * 1000 : 0; },
  anchor(s, half) {
    const h = s.halves[half];
    if (h && h.anchorTs != null) return h.anchorTs;
    const f = this.bipsOf(s, half)[0];
    return f ? f.startTs : null;
  },
  /** match clock value at a given wall time */
  clockAt(s, half, ts) {
    const a = this.anchor(s, half);
    return a == null ? null : this.baseMs(s, half) + (ts - a);
  },
  liveClock(s, half, now) {
    const a = this.anchor(s, half);
    if (a == null) return { ms: this.baseMs(s, half), state: 'waiting' };
    const end = s.halves[half].endTs;
    return { ms: this.baseMs(s, half) + Math.max(0, (end ?? now) - a), state: end != null ? 'ended' : 'running' };
  },
  /** BOP currently accumulating (after last STOP, before next START) */
  openBop(s, half, now) {
    if (this.running(s)) return null;
    if (s.halves[half].endTs != null) return null;
    const list = this.bipsOf(s, half), last = list[list.length - 1];
    return last && last.endTs != null ? now - last.endTs : null;
  },
  /** validate an edit against neighbours in the same half */
  validate(s, bip, startTs, endTs, now) {
    const list = this.bipsOf(s, bip.half), i = list.findIndex(b => b.id === bip.id);
    const prev = list[i - 1], next = list[i + 1];
    if (startTs == null) return 'Start time format: HH:MM:SS.s';
    if (bip.endTs != null && endTs == null) return 'End time format: HH:MM:SS.s';
    if (endTs != null && endTs <= startTs) return 'End must be after Start.';
    if (endTs == null && startTs > now) return 'Start cannot be in the future.';
    if (prev && prev.endTs != null && startTs < prev.endTs) return 'Overlaps BIP ' + i + ' (ends ' + fmtHMSt(prev.endTs) + ').';
    if (next && endTs != null && endTs > next.startTs) return 'Overlaps BIP ' + (i + 2) + ' (starts ' + fmtHMSt(next.startTs) + ').';
    return null;
  },
};

/* =========================================================
   Persistence — IndexedDB primary, localStorage mirror
   ========================================================= */
const KEY = 'bip-tracker-v1';
const Store = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('bip-tracker', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
        r.onblocked = () => res();
      } catch (e) { res(); }
    });
  },
  readIdb() {
    return new Promise(res => {
      if (!this.db) return res(null);
      try {
        const q = this.db.transaction('kv').objectStore('kv').get(KEY);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  readLs() { try { const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } },
  async load() {
    await this.open();
    const a = await this.readIdb(), b = this.readLs();
    if (a && b) return (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a;
    return a || b;
  },
  save(state) {
    state.updatedAt = Date.now();
    const json = JSON.stringify(state);
    try { localStorage.setItem(KEY, json); } catch (e) {}
    try {
      if (this.db) this.db.transaction('kv', 'readwrite').objectStore('kv').put(JSON.parse(json), KEY);
    } catch (e) {}
  },
};

/* =========================================================
   State
   ========================================================= */
let S = { version: 1, activeId: null, sessions: [] };
const ui = { scope: null, undo: [], lastCommit: 0, sheet: null, armed: null };
const cur = () => S.sessions.find(x => x.id === S.activeId) || null;
const save = () => Store.save(S);

function newSession({ type, name, opponent, date }) {
  const halves = type === 'match'
    ? { '1': { anchorTs: null, endTs: null }, '2': { anchorTs: null, endTs: null } }
    : { 'T': { anchorTs: null, endTs: null } };
  return {
    id: uid(), type, name: name || (type === 'match' ? 'Match' : 'Training'), opponent: opponent || '',
    date: date || todayStr(), createdAt: Date.now(), activeHalf: type === 'match' ? '1' : 'T',
    halves, settings: { secondHalfBaseSec: 2400, clockOffsetMs: 0 }, bips: [], team: '',
  };
}
function newBip(half, ts) {
  return {
    id: uid(), half, startTs: ts, endTs: null, tz: tzName(), tzOffsetMin: 540, deviceTz: (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } })(),
    createdAt: Date.now(), deleted: false, deletedAt: null,
    bopExcludedMs: 0, bopExcludeReason: '', score: null, original: { startTs: ts, endTs: null }, history: [],
  };
}

function pushUndo(label) {
  const s = cur(); if (!s) return;
  ui.undo.push({ label, sid: s.id, bips: JSON.stringify(s.bips), halves: JSON.stringify(s.halves), activeHalf: s.activeHalf,
    squad: JSON.stringify(s.squad || []), subs: JSON.stringify(s.subs || []) });
  if (ui.undo.length > 40) ui.undo.shift();
}
function undo() {
  const u = ui.undo.pop(); if (!u) return;
  const s = S.sessions.find(x => x.id === u.sid); if (!s) return;
  s.bips = JSON.parse(u.bips); s.halves = JSON.parse(u.halves); s.activeHalf = u.activeHalf;
  if (u.squad) { s.squad = JSON.parse(u.squad); s.subs = JSON.parse(u.subs); }
  S.activeId = s.id; save(); render(); toast('Undone: ' + u.label);
}

/* =========================================================
   Measuring
   ========================================================= */
function commit(ts) {
  const s = cur(); if (!s) return;
  if (ts - ui.lastCommit < 350) return;           // swallow double taps
  ui.lastCommit = ts;
  const r = Core.running(s);
  if (r) {
    pushUndo('Stop BIP');
    r.endTs = Math.max(ts, r.startTs + 1);
    r.original.endTs = r.endTs;
  } else {
    const h = s.activeHalf;
    const list = Core.bipsOf(s, h), last = list[list.length - 1];
    if (last && last.endTs != null && ts < last.endTs) ts = last.endTs;
    pushUndo('Start BIP');
    const nb = newBip(h, ts);
    if (s.halves[h].endTs != null && last) nb.bopBreakBefore = true; // time after a half ended is never BOP
    s.halves[h].endTs = null;
    s.bips.push(nb);
  }
  save();
  const pad = $('#pad');
  pad.classList.remove('flash'); void pad.offsetWidth; pad.classList.add('flash');
  try { navigator.vibrate && navigator.vibrate(18); } catch (e) {}
  render();
}

function $(sel) { return document.querySelector(sel); }

/* pointerdown captures the moment; pointerup confirms it was a tap, not a scroll */
const pad = $('#pad');
let press = null;
const eventWallTs = e => Date.now() - Math.max(0, performance.now() - e.timeStamp);
pad.addEventListener('pointerdown', e => {
  if (e.button > 0 || pad.disabled) return;
  press = { ts: eventWallTs(e), x: e.clientX, y: e.clientY, id: e.pointerId };
  pad.classList.add('pressing');
  keepAwake();
});
pad.addEventListener('pointermove', e => {
  if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 28) { press = null; pad.classList.remove('pressing'); }
});
pad.addEventListener('pointerup', e => {
  pad.classList.remove('pressing');
  if (press && e.pointerId === press.id) { const t = press.ts; press = null; commit(t); }
});
['pointercancel', 'pointerleave'].forEach(ev => pad.addEventListener(ev, () => { press = null; pad.classList.remove('pressing'); }));
pad.addEventListener('click', e => { if (e.detail === 0) commit(Date.now()); }); // keyboard activation
pad.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || ui.sheet || !$('#report').hidden || !$('#squad').hidden || e.target.closest('input,textarea,select,button')) return;
  e.preventDefault(); if (!e.repeat) commit(Date.now());
});

/* =========================================================
   Wake lock + PWA
   ========================================================= */
let wake = null;
async function keepAwake() {
  try {
    if (!wake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release', () => { wake = null; });
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); tick(true); } });
try {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) navigator.serviceWorker.register('sw.js').catch(() => {});
} catch (e) {}

/* =========================================================
   Render
   ========================================================= */
const ICON = {
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/></svg>',

};
const LONG_BOP = 180000;

function scopeOf(s) {
  if (s.type !== 'match') return 'T';
  return ui.scope || s.activeHalf;
}

function render() {
  const s = cur();
  if (!s) return;
  const running = Core.running(s);
  $('#sType').textContent = s.type === 'match' ? 'Match' : 'Training';

        (running && s.activeHalf === h ? ICON.lock : '') + (h === '1' ? '1st' : '2nd') + '</button>').join('') + '</div>';
  } else {
    per.innerHTML = '<div class="seg"><button data-act="half" data-h="T" aria-pressed="true">' + (running ? ICON.lock : '') + 'Training</button></div>';

  if (started && !ended) {

    : '<span class="chip">SESSION</span>';

  // stats

  $('#stCount').textContent = st.count;
  $('#stCountD').textContent = sc === 'full' ? 'both halves' : 'confirmed';
  $('#stTotal').textContent = fmtMS(st.total);
  $('#stAvg').innerHTML = st.avg == null ? '—' : fmtDur(st.avg) + '<small>s</small>';
  $('#stMax').innerHTML = st.max == null ? '—' : fmtDur(st.max) + '<small>s</small>';
  $('#stMaxD').textContent = st.maxRow ? 'BIP ' + st.maxRow.no + (sc === 'full' ? ' · ' + (st.maxRow.half === '1' ? '1st' : '2nd') : '') : 'longest';

  $('#stWrD').textContent = st.pairs ? st.pairs + ' pairs · adj. BOP' : 'needs a confirmed BOP';

  // undo

  $('#undoBtn').disabled = !u;
  $('#undoLbl').textContent = u ? 'Undo ' + u.label.replace(' BIP', '').toLowerCase() : 'Undo';

  renderHistory(s, sc);
  renderScorePad(s, running);

  if (!$('#squad').hidden) renderSquad();

}

const teamName = (s, side) => side === 'us' ? (s.team || 'Us') : (s.opponent || 'Opp');
const scoreLabel = (s, sc) => sc ? teamName(s, sc.side) + ' ' + SCORE[sc.type].name + (sc.type === 'try' ? (sc.conv === true ? ' + conv' : sc.conv === false ? ' (conv missed)' : '') : '') : '—';
/** the BIP a score tap applies to: the one in play, else the last one of the active half */
function scoreTarget(s, running) {
  if (running) return running;
  return Core.bipsOf(s, s.activeHalf).pop() || null;
}
function renderScorePad(s, running) {
  const b = scoreTarget(s, running), el = $('#scorePad');
  if (!b) { el.innerHTML = ''; return; }
  const no = Core.bipsOf(s, b.half).indexOf(b) + 1, sc = scoreOf(b);
  const tot = Core.stats(Core.scopeRows(s, s.type === 'match' ? 'full' : 'T')).score;
  const btn = (side, type, label, pts, on, dis) => '<button class="spb" data-act="score" data-side="' + side + '" data-type="' + type + '" data-id="' + b.id + '" aria-pressed="' + on + '"' + (dis ? ' disabled' : '') + '>' + label + '<small>' + pts + '</small></button>';
  el.innerHTML = '<div class="sp-head"><span class="lbl">Score · BIP ' + no + '</span>' +
    '<span class="sp-live">' + esc(teamName(s, 'us')) + ' <b>' + tot.us.pts + '</b> – <b>' + tot.opp.pts + '</b> ' + esc(teamName(s, 'opp')) + '</span></div>' +
    ['us', 'opp'].map(side => {
      const mine = sc && sc.side === side ? sc : null;
      return '<div class="sp-row"><span class="sp-team">' + esc(teamName(s, side)) + '</span>' +
        btn(side, 'try', 'Try', '+5', !!mine && mine.type === 'try') +
        btn(side, 'conv', 'Conv', '+2', !!mine && mine.type === 'try' && mine.conv === true, !(mine && mine.type === 'try')) +
        btn(side, 'pg', 'PG', '+3', !!mine && mine.type === 'pg') +
        btn(side, 'dg', 'DG', '+3', !!mine && mine.type === 'dg') + '</div>';
    }).join('');
}
function setScore(s, b, side, type) {
  const before = scoreOf(b);
  let next;
  if (type === 'conv') {
    if (!before || before.side !== side || before.type !== 'try') return;
    next = { ...before, conv: before.conv === true ? null : true };
  } else {
    next = before && before.side === side && before.type === type ? null : { side, type, conv: null };
  }
  pushUndo('Score');
  b.history.push({ at: Date.now(), field: 'score', from: scoreLabel(s, before), to: scoreLabel(s, next) });
  b.score = next; delete b.try;
  save(); render();
  const no = Core.bipsOf(s, b.half).indexOf(b) + 1;
  toast(next ? scoreLabel(s, next) + ' (+' + (type === 'conv' && next.conv ? CONV_PTS : scorePts(next)) + ') · BIP ' + no : 'Score cleared · BIP ' + no);
}

function renderHistory(s, sc) {
  const halves = sc === 'full' ? Core.halves(s).slice().reverse() : [sc];

    if (sc === 'full') html += '<div class="hsec">' + HALF_LABEL[h] + ' · ' + rows.filter(r => r.bipMs != null).length + ' BIP</div>';
    html += rows.slice().reverse().map(r => histRow(r, s)).join('');

let lastSec = -1;
function tick(force) {
  const s = cur(); if (!s) return;
  const now = Date.now();
  const sec = Math.floor(now / 100);
  const running = Core.running(s);
  if (!force && !running && sec === lastSec) return;
  lastSec = sec;
  const d = J(now);
  $('#rtClock').innerHTML = p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + '<small>:' + p2(d.getUTCSeconds()) + '</small>';
  $('#rtTz').textContent = tzLabel();

  const h = s.activeHalf;
  const mc = Core.liveClock(s, h, now);
  $('#mcClock').textContent = fmtClock(mc.ms);
  const sub = $('#mcSub');
  sub.classList.toggle('frozen', mc.state === 'ended');
  sub.textContent = mc.state === 'waiting' ? 'starts on first START' : mc.state === 'ended' ? HALF_LABEL[h] + ' ended' : HALF_LABEL[h];

  // pad
  const stage = $('#stage'), arc = $('#ringArc');
  pad.classList.toggle('running', !!running);
  stage.classList.toggle('running', !!running);
  const next = Core.bipsOf(s, h).length + (running ? 0 : 1);
  if (running) {
    const el = now - running.startTs;
    $('#padK').textContent = 'TAP TO STOP';
    $('#padMain').textContent = fmtDur(el);
    $('#padSub').textContent = 'BIP ' + next + ' · in play';
    pad.setAttribute('aria-label', 'Stop ball in play');
    arc.setAttribute('stroke-dashoffset', String(603.2 * (1 - (el % 60000) / 60000)));
    $('#stCur').innerHTML = fmtDur(el) + '<small>s</small>';
    $('#stCurD').textContent = 'BIP ' + next + ' live';
    $('#stCurBox').classList.add('live');
    const lc = document.getElementById('liveCell'); if (lc) lc.textContent = fmtDur(el);
  } else {
    $('#padK').textContent = 'BALL IN PLAY';
    $('#padMain').textContent = 'START';
    $('#padSub').textContent = 'BIP ' + next;
    pad.setAttribute('aria-label', 'Start ball in play');
    $('#stCur').textContent = '—';
    $('#stCurD').textContent = 'not in play';
    $('#stCurBox').classList.remove('live');
    arc.setAttribute('stroke-dashoffset', '603.2');
  }
  const ob = Core.openBop(s, h, now);
  const rows = Core.rows(s, h), lastDone = rows.filter(r => r.bipMs != null).pop();
  $('#bopLine').innerHTML = running
    ? (lastDone && lastDone.bopOrigMs != null ? '<span>Last BOP <b>' + fmtDur(lastDone.bopOrigMs) + 's</b></span>' : '')
    : (ob != null ? '<span>Ball out <b>' + fmtDur(ob) + 's</b></span>' : '') + (lastDone ? '<span>Last BIP <b>' + fmtDur(lastDone.bipMs) + 's</b></span>' : '');
}
(function loop() { tick(false); requestAnimationFrame(loop); })();

/* ---- half switch ---- */
function halfSheet(h) {

  const curH = s.activeHalf;
  const curEnded = s.halves[curH].endTs != null;
  const started = Core.anchor(s, curH) != null;
  let html = head(s.type === 'match' ? 'Half' : 'Training session', 'Switching never links BOP across halves.');
  html += '<div class="choice">';
  if (h !== curH) {
    html += '<button data-act="doSwitch" data-h="' + h + '"><b>Switch to ' + HALF_LABEL[h] + '</b><span>' +
      (started && !curEnded ? 'Ends ' + HALF_LABEL[curH] + ' now and freezes its clock. ' : '') +
      (h === '2' ? 'Match clock starts at ' + fmtClock(Core.baseMs(s, '2')) + ' on the first START.' : 'Continue recording the 1st half.') + '</span></button>';
  }
  if (started && !curEnded) html += '<button data-act="endHalf"><b>End ' + HALF_LABEL[curH] + '</b><span>Freeze the clock. No BOP is counted after the last BIP.</span></button>';
  if (curEnded) html += '<button data-act="resumeHalf"><b>Resume ' + HALF_LABEL[curH] + ' clock</b><span>Unfreeze the clock (also happens on the next START).</span></button>';
  html += '</div>';

function endHalf(s, h, ts) {
  if (Core.anchor(s, h) == null || s.halves[h].endTs != null) return;
  const last = Core.bipsOf(s, h).pop();
  s.halves[h].endTs = Math.max(ts, last && last.endTs ? last.endTs : 0);
}

    html += '<div class="sh-sec"><span class="lbl">Change log</span><div class="loglist">' +

}
function saveEdit(id) {
  const s = cur(), b = s.bips.find(x => x.id === id); if (!b) return;
  const live = b.endTs == null;
  const st = readTime($('#edStart').value, b.startTs);
  const en = live ? null : readTime($('#edEnd').value, b.endTs);
  const err = Core.validate(s, b, st, en, Date.now());
  if (err) { $('#edMsg').textContent = err; return; }
  const row = Core.rows(s, b.half).find(r => r.b.id === id);
  const at = Date.now(), changes = [];
  if (st !== b.startTs) changes.push(['start', fmtHMSt(b.startTs), fmtHMSt(st), () => { b.startTs = st; }]);
  if (!live && en !== b.endTs) changes.push(['end', fmtHMSt(b.endTs), fmtHMSt(en), () => { b.endTs = en; }]);
  const ex = $('#edExcl');
  if (ex) {
    const v = Math.round(Math.min(row.bopOrigMs, Math.max(0, (parseFloat(ex.value) || 0) * 1000)));
    const reason = $('#edReason').value.trim();
    if (v !== (b.bopExcludedMs || 0)) changes.push(['BOP excluded', (b.bopExcludedMs / 1000).toFixed(1) + 's', (v / 1000).toFixed(1) + 's', () => { b.bopExcludedMs = v; }]);
    if (reason !== (b.bopExcludeReason || '')) changes.push(['reason', b.bopExcludeReason || '—', reason || '—', () => { b.bopExcludeReason = reason; }]);
  }
  const side = $('#edSide').dataset.v, type = $('#edType').dataset.v, cv = $('#edConv').dataset.v;
  const nsc = side ? { side, type, conv: type === 'try' ? (cv === 'made' ? true : cv === 'missed' ? false : null) : null } : null;
  const osc = scoreOf(b);
  if (JSON.stringify(nsc) !== JSON.stringify(osc)) changes.push(['score', scoreLabel(s, osc), scoreLabel(s, nsc), () => { b.score = nsc; delete b.try; }]);
  if (!changes.length) { closeSheet(); return; }
  pushUndo('Edit BIP');
  changes.forEach(([field, from, to, apply]) => { apply(); b.history.push({ at, field, from, to }); });
  save(); closeSheet(); render(); toast('BIP ' + row.no + ' updated');
}
function deleteBip(id) {
  const s = cur(), b = s.bips.find(x => x.id === id); if (!b || b.endTs == null) return;
  const no = Core.rows(s, b.half).find(r => r.b.id === id)?.no;
  pushUndo('Delete BIP');
  b.deleted = true; b.deletedAt = Date.now();
  b.history.push({ at: b.deletedAt, field: 'deleted', from: 'no', to: 'yes' });
  save(); render(); toast('BIP ' + no + ' deleted', { act: 'undo', label: 'Undo' });
}

function saveSettings() {
  const s = cur();
  const anchors = {};
  for (const h of Core.halves(s)) {
    const v = $('#cfA' + h).value.trim();
    if (!v) { anchors[h] = null; continue; }
    const ref = Core.bipsOf(s, h)[0]?.startTs ?? s.halves[h].anchorTs ?? new Date(s.date + 'T12:00:00+09:00').getTime();
    const t = parseTime(v, ref);
    if (t == null) { $('#cfMsg').textContent = HALF_LABEL[h] + ': use HH:MM:SS'; return; }
    anchors[h] = t;
  }
  pushUndo('Settings');
  s.name = $('#cfName').value.trim() || s.name;
  s.opponent = $('#cfOpp').value.trim();
  s.team = $('#cfTeam').value.trim();
  s.date = $('#cfDate').value || s.date;
  for (const h in anchors) s.halves[h].anchorTs = anchors[h];

/* minimal ZIP (stored, no compression) */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);

  }

  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

const downloadsCap = window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(filename, blob) {

    catch (e) { if (e && e.code !== 'declined') toast('Save unavailable here. Use Copy instead.'); }

/* =========================================================
   Squad — matchday squad, substitutions, per-player time.
   Separate from the BIP logic: it only reads half windows
   and BIP intervals from Core, and never changes them.
   ========================================================= */
const SUB_KIND = {
  sub:    { label: 'Sub',         swap: true },
  blood:  { label: 'Blood',       swap: true },
  hia:    { label: 'HIA',         swap: true },
  yellow: { label: 'Yellow card' },
  red:    { label: 'Red card' },
  ret:    { label: 'Return' },
};
const overlap = (a1, a2, b1, b2) => Math.max(0, Math.min(a2, b2) - Math.max(a1, b1));
const Squad = {
  player(pid) { return (S.roster || []).find(p => p.id === pid) || { id: pid, name: '?' }; },
  entry(s, pid) { return (s.squad || []).find(e => e.pid === pid); },
  label(s, pid) { const e = this.entry(s, pid); return (e && e.no ? '#' + e.no + ' ' : '') + this.player(pid).name; },
  events(s) { return (s.subs || []).slice().sort((a, b) => a.ts - b.ts); },
  /** Replay events in time order → on-field intervals and current status per player.
      Starters are on from the start; time outside each half's window is clipped later,
      so a half-time substitution needs no special case. */
  replay(s) {
    const on = new Map(), iv = new Map(), status = new Map();
    const add = (pid, x) => { if (!iv.has(pid)) iv.set(pid, []); iv.get(pid).push(x); };
    for (const e of s.squad || []) { status.set(e.pid, e.starter ? 'on' : 'bench'); if (e.starter) on.set(e.pid, -Infinity); }
    for (const ev of this.events(s)) {
      if (ev.offPid) {
        if (on.has(ev.offPid)) { add(ev.offPid, [on.get(ev.offPid), ev.ts]); on.delete(ev.offPid); }
        status.set(ev.offPid, ev.kind === 'yellow' ? 'bin' : ev.kind === 'red' ? 'red' : 'off');
      }
      if (ev.onPid && !on.has(ev.onPid)) { on.set(ev.onPid, ev.ts); status.set(ev.onPid, 'on'); }
    }
    for (const [pid, from] of on) add(pid, [from, Infinity]);
    return { iv, status };
  },
  stats(s, now) {
    const { iv, status } = this.replay(s), halves = Core.halves(s), evs = this.events(s);
    const win = {}, bips = {}, teamBip = {};
    for (const h of halves) {
      const a = Core.anchor(s, h);
      win[h] = a == null ? null : [a, s.halves[h].endTs ?? now];
      bips[h] = Core.bipsOf(s, h).map(b => [b.startTs, b.endTs ?? now]);
      teamBip[h] = bips[h].reduce((a2, [x, y]) => a2 + (y - x), 0);
    }
    const teamTot = halves.reduce((a, h) => a + teamBip[h], 0);
    return (s.squad || []).map(e => {
      const ivs = iv.get(e.pid) || [], min = {}, bip = {};
      for (const h of halves) {
        min[h] = win[h] ? ivs.reduce((a, [x, y]) => a + overlap(x, y, win[h][0], win[h][1]), 0) : 0;
        bip[h] = bips[h].reduce((a, [bx, by]) => a + ivs.reduce((c, [x, y]) => c + overlap(x, y, bx, by), 0), 0);
      }
      const sum = o => halves.reduce((a, h) => a + o[h], 0);
      const lastYellow = evs.filter(v => v.offPid === e.pid && v.kind === 'yellow').pop();
      return {
        pid: e.pid, no: e.no, starter: !!e.starter, name: this.player(e.pid).name, status: status.get(e.pid),
        min, bip, minTotal: sum(min), bipTotal: sum(bip), bipShare: teamTot ? sum(bip) / teamTot * 100 : null,
        onCount: evs.filter(v => v.onPid === e.pid && SUB_KIND[v.kind].swap).length,
        offCount: evs.filter(v => v.offPid === e.pid && SUB_KIND[v.kind].swap).length,
        yellow: evs.filter(v => v.offPid === e.pid && v.kind === 'yellow').length,
        red: evs.filter(v => v.offPid === e.pid && v.kind === 'red').length,
        binSince: lastYellow ? lastYellow.ts : null,
      };
    }).sort((a, b) => (a.no || 999) - (b.no || 999) || a.name.localeCompare(b.name));
  },
};

function renderSquad() {

function rosterFind(name) { return (S.roster || []).find(p => p.name.trim().toLowerCase() === name.trim().toLowerCase() && !p.sample); }
function sqAddToSquad(s, name, no, starter) {

/* =========================================================

const PDF_LIBS = [

function loadScript(src) {
  return new Promise((res, rej) => {

    const el = document.createElement('script');
    el.src = src; el.crossOrigin = 'anonymous';
    el.onload = res; el.onerror = () => { el.remove(); rej(new Error('load ' + src)); };
    document.head.appendChild(el);

}
const prEl = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
function scoringEvents(s) {
  const evs = [];
  for (const h of Core.halves(s)) for (const r of Core.rows(s, h)) {
    const sc = scoreOf(r.b); if (!sc) continue;
    evs.push({ ts: r.b.endTs ?? r.b.startTs, half: h, no: r.no, sc, clock: Core.clockAt(s, h, r.b.endTs ?? r.b.startTs) });
  }
  evs.sort((a, b) => a.ts - b.ts);
  let us = 0, opp = 0;
  evs.forEach(e => { if (e.sc.side === 'us') us += scorePts(e.sc); else opp += scorePts(e.sc); e.after = us + '–' + opp; });
  return evs;
}
function pdfBlocks(s) {

    '</tbody></table></div>') });

  const evs = scoringEvents(s);
  if (evs.length) blocks.push({ rows: evs, render: (rows, cont) => prEl('<div class="pr-sec"><div class="pr-t">Scoring' + (cont ? ' (cont.)' : '') + '<span>Attached to the BIP the score came from</span></div><table class="pr-tab"><thead><tr><th>Clock</th><th style="text-align:left">Half</th><th style="text-align:left">Team</th><th style="text-align:left">Score</th><th>BIP</th><th>Pts</th><th>Total</th></tr></thead><tbody>' +

      rows.map(p => '<tr><td>' + (p.no || '') + '</td><td class="l">' + esc(p.name) + (p.starter ? '' : '<span class="pr-tag">R</span>') + (p.yellow ? '<span class="pr-tag">YC</span>' : '') + (p.red ? '<span class="pr-tag">RC</span>' : '') + '</td>' +

        '<td>' + fmtMS(p.bipTotal) + '</td><td class="sm">' + (p.bipShare == null ? '—' : p.bipShare.toFixed(0) + '%') + '</td></tr>').join('') +

    const ch = Squad.events(s);

        '<td class="l">' + (ev.offPid ? esc(Squad.label(s, ev.offPid)) : '—') + '</td><td class="l">' + (ev.onPid ? esc(Squad.label(s, ev.onPid)) : '—') + '</td></tr>').join('') +

/** Fill A4 pages block by block; tables split across pages by rows. */
function paginate(host, blocks) {
  const pages = [];
  const newPage = () => {
    const pg = prEl('<div class="pr-page"><div class="pr-body"></div><div class="pr-foot"><span></span><span></span></div></div>');
    host.appendChild(pg); const o = { el: pg, body: pg.firstElementChild }; pages.push(o); return o;
  };
  const fits = pg => pg.body.scrollHeight <= pg.body.clientHeight + 1;
  let page = newPage();
  for (const b of blocks) {
    if (b.newPage && page.body.children.length) page = newPage();
    if (!b.rows) {
      const el = b.render(); page.body.appendChild(el);
      if (!fits(page) && page.body.children.length > 1) { el.remove(); page = newPage(); page.body.appendChild(el); }
      continue;
    }
    let rows = b.rows, cont = false;
    while (rows.length) {
      let n = rows.length, el = null;
      while (n > 0) { el = b.render(rows.slice(0, n), cont); page.body.appendChild(el); if (fits(page)) break; el.remove(); n--; }
      if (n === 0) {
        if (page.body.children.length) { page = newPage(); continue; }
        n = 1; page.body.appendChild(b.render(rows.slice(0, 1), cont));
      }
      rows = rows.slice(n); cont = true;
      if (rows.length) page = newPage();
    }
  }
  return pages;
}
let pdfBusy = false;
async function exportPdf() {

    host = document.createElement('div'); host.className = 'pr-host'; document.body.appendChild(host);
    try { await document.fonts.ready; } catch (e) {}
    const pages = paginate(host, pdfBlocks(s));

      const f = pg.el.querySelectorAll('.pr-foot span');
      f[0].textContent = s.name + ' · ' + s.date + ' · generated ' + made + ' JST';
      f[1].textContent = 'Page ' + (i + 1) + ' / ' + pages.length;
    });
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
    for (let i = 0; i < pages.length; i++) {
      const c = await window.html2canvas(pages[i].el, { scale: 2, backgroundColor: '#ffffff', logging: false, width: 794, height: 1123, windowWidth: 794 });
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
    }
    await saveFile(fileBase(s) + '_report.pdf', pdf.output('blob'));
  } catch (e) {
    toast('PDF could not be created: ' + (e && e.message ? e.message : 'unknown error'));
  } finally {
    if (host) host.remove();
    pdfBusy = false;
  }
}

function playersCsv(s) {
  const hs = Core.halves(s), match = hs.length > 1;
  const out = [['Session ID', 'Session Name', 'Date', 'No.', 'Player', 'Started',
    ...(match ? ['Minutes 1st', 'Minutes 2nd'] : []), 'Minutes Total', 'Time on Field (mm:ss)',
    ...(match ? ['BIP 1st (sec)', 'BIP 2nd (sec)'] : []), 'BIP Total (sec)', 'BIP Share (%)', 'Subbed On', 'Subbed Off', 'Yellow Cards', 'Red Cards']];
  const mins = ms => (ms / 60000).toFixed(1);
  for (const p of Squad.stats(s, Date.now())) {
    out.push([s.id, s.name, s.date, p.no || '', p.name, p.starter ? 'Y' : 'N',
      ...(match ? [mins(p.min['1']), mins(p.min['2'])] : []), mins(p.minTotal), fmtMS(p.minTotal),
      ...(match ? [sec(p.bip['1']), sec(p.bip['2'])] : []), sec(p.bipTotal), p.bipShare == null ? '' : p.bipShare.toFixed(1),
      p.onCount, p.offCount, p.yellow, p.red]);
  }
  return csv(out);
}

/* =========================================================
   Sample data (first launch only, clearly labelled)
   ========================================================= */
function seedSample() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const s = newSession({ type: 'match', name: 'Demo match', opponent: 'Sample XV' });
  s.sample = true;
  const k = jstDayStart(Date.now()) - DAY_MS + (14 * 3600 + 3) * 1000; // yesterday 14:00:03 JST
  s.date = todayStr(k);
  const play = (half, t0, until) => {
    let t = t0, i = 0;
    while (t < until) {
      const bip = Math.round((6 + Math.pow(rnd(), 1.6) * 88) * 1000 + rnd() * 900);
      const b = newBip(half, t); b.endTs = t + bip; b.original.endTs = b.endTs;
      s.bips.push(b);
      if (i % 7 === 5) b.score = { side: (i + (half === '2' ? 1 : 0)) % 2 ? 'us' : 'opp', type: 'try', conv: i % 3 !== 0 };
      else if (i % 11 === 8) b.score = { side: i % 2 ? 'opp' : 'us', type: 'pg', conv: null };
      let bop = Math.round((14 + Math.pow(rnd(), 1.3) * 80) * 1000);
      if (half === '1' && i === 17) { bop = 286400; b.bopExcludedMs = 210000; b.bopExcludeReason = 'Injury stoppage'; b.history.push({ at: b.endTs + 3600000, field: 'BOP excluded', from: '0.0s', to: '210.0s' }); }
      if (half === '2' && i === 21) bop = 198300;
      t = b.endTs + bop; i++;
    }
    const last = s.bips[s.bips.length - 1];
    return last.endTs;
  };
  s.halves['1'].endTs = play('1', k, k + 40 * 60000) + 20000;
  const k2 = s.halves['1'].endTs + 12 * 60000;
  s.halves['2'].endTs = play('2', k2, k2 + 40 * 60000) + 15000;
  s.activeHalf = '2';
  seedSampleSquad(s);
  return s;
}
function seedSampleSquad(s) {
  const names = ['Sato', 'Suzuki', 'Takahashi', 'Tanaka', 'Ito', 'Watanabe', 'Yamamoto', 'Nakamura', 'Kobayashi', 'Kato', 'Yoshida', 'Yamada', 'Sasaki', 'Yamaguchi', 'Matsumoto',
    'Inoue', 'Kimura', 'Hayashi', 'Shimizu', 'Yamazaki', 'Mori', 'Abe', 'Ikeda'];
  S.roster = S.roster || []; s.squad = []; s.subs = [];
  const pid = {};
  names.forEach((n, i) => { const p = { id: uid(), name: n, no: i + 1, sample: true }; S.roster.push(p); pid[i + 1] = p.id; s.squad.push({ pid: p.id, no: i + 1, starter: i < 15 }); });
  const a2 = Core.anchor(s, '2'), ht = s.halves['1'].endTs, m = 60000;
  if (a2 == null || ht == null) return;
  const ev = (ts, kind, off, on, half) => s.subs.push({ id: uid(), ts, kind, offPid: off ? pid[off] : undefined, onPid: on ? pid[on] : undefined, half });
  ev(Core.anchor(s, '1') + 24 * m, 'blood', 12, 22, '1'); ev(Core.anchor(s, '1') + 31 * m, 'blood', 22, 12, '1');
  ev(ht + 4 * m, 'sub', 1, 16, '2');
  ev(a2 + 9 * m, 'yellow', 7, null, '2'); ev(a2 + 19 * m, 'ret', null, 7, '2');
  ev(a2 + 12 * m, 'sub', 3, 18, '2'); ev(a2 + 12 * m + 500, 'sub', 2, 17, '2');
  ev(a2 + 22 * m, 'sub', 4, 19, '2'); ev(a2 + 25 * m, 'sub', 9, 21, '2');
  ev(a2 + 28 * m, 'sub', 6, 20, '2'); ev(a2 + 31 * m, 'sub', 10, 23, '2');
}

/* =========================================================
   Boot
   ========================================================= */
(async () => {
  const loaded = await Store.load();
  if (loaded && Array.isArray(loaded.sessions) && loaded.sessions.length) {
    S = loaded; S.roster = S.roster || [];
    S.sessions.filter(x => x.sample && !(x.squad || []).length).forEach(x => seedSampleSquad(x));
  }
  else { const demo = seedSample(); S.sessions = [demo]; S.activeId = demo.id; save(); }
  if (!cur()) S.activeId = S.sessions[0].id;
  render();
})();
})();
